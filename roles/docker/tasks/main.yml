---
# Pre-flight check
- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: docker_check
  changed_when: false
  failed_when: false

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: docker_check.rc != 0

- name: Add Docker GPG key
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  when: docker_check.rc != 0

- name: Add Docker repository
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list
  when: docker_check.rc != 0

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: yes
  when: docker_check.rc != 0

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin   # docker build's builder
      - docker-compose-plugin  # docker compose (projects' compose.yml)
      - python3-docker  # Required for community.docker modules
    state: present
  when: docker_check.rc != 0

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    groups: docker
    append: yes
  when: docker_check.rc != 0

- name: Get Docker info
  community.docker.docker_host_info:
  register: docker_info
  ignore_errors: true

- name: Display Docker status
  ansible.builtin.debug:
    msg: "Docker {{ docker_info.host_info.ServerVersion | default('unknown') }}{% if docker_check.rc == 0 %} (already installed){% endif %} - Containers: {{ docker_info.host_info.Containers | default(0) }}"
