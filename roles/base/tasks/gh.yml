---
# The GitHub CLI (gh) from GitHub's own apt repo: Ubuntu's is years behind.
# With the repo added, apt prefers GitHub's gh (replacing Ubuntu's, if an
# earlier install put it there), and apt upgrades keep it current.
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add GitHub CLI signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli

- name: Install the GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: latest

- name: Get gh version
  ansible.builtin.shell: gh --version | head -1
  register: gh_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: Display gh status
  ansible.builtin.debug:
    msg: "{{ gh_version.stdout }}"
