---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - unzip
      - python3-pip  # Required for ansible collections
      - git          # nvm, dev-scripts
      - bash-completion
      - xdg-utils    # xdg-open: tools open your browser with it (aws login, gh)
    state: present

# Node.js through nvm (dev only): node.yml.
- name: Node.js (dev only)
  ansible.builtin.include_tasks: node.yml
  when: env == "dev"

# Terraform through tfenv (dev only): terraform.yml.
- name: Terraform (dev only)
  ansible.builtin.include_tasks: terraform.yml
  when: env == "dev"

# The GitHub CLI from GitHub's own apt repo (dev only): gh.yml.
- name: GitHub CLI (dev only)
  ansible.builtin.include_tasks: gh.yml
  when: env == "dev"

# AWS CLI v2, the latest from AWS, when it's missing or older than
# aws_cli_min_version (2.32, the first with `aws login`).
- name: Get the AWS CLI's version
  ansible.builtin.shell: aws --version 2>/dev/null | sed -nE 's#^aws-cli/([0-9.]+).*#\1#p'
  register: aws_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether the AWS CLI needs installing or updating
  ansible.builtin.set_fact:
    aws_install: "{{ aws_installed.stdout == '' or aws_installed.stdout is version(aws_cli_min_version, '<') }}"

- name: Download AWS CLI
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: '0644'
  when: aws_install

- name: Unzip AWS CLI
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: yes
    creates: /tmp/aws
  when: aws_install

- name: Install or update AWS CLI
  ansible.builtin.command: /tmp/aws/install --update
  when: aws_install

- name: Get AWS CLI version
  ansible.builtin.command: aws --version
  register: aws_version
  changed_when: false

- name: Display AWS CLI status
  ansible.builtin.debug:
    msg: "AWS CLI version: {{ aws_version.stdout }}{% if not aws_install %} (already installed){% endif %}"

- name: Cleanup AWS CLI install files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/awscliv2.zip
    - /tmp/aws
  when: aws_install
